<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7C2D12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Plate Glow -->
  <g filter="url(#shadow)">
    <!-- Plate Rim -->
    <circle cx="256" cy="256" r="160" fill="url(#plateGrad)" />
    <!-- Plate Inner Groove -->
    <circle cx="256" cy="256" r="128" fill="none" stroke="#E5E7EB" stroke-width="5" />
    <!-- Plate Center Recess -->
    <circle cx="256" cy="256" r="108" fill="#FFFFFF" />
  </g>

  <!-- Fork (Left) -->
  <g fill="#EA580C" transform="translate(195, 175)">
    <!-- Tines -->
    <rect x="0" y="0" width="5" height="42" rx="2.5" />
    <rect x="11" y="0" width="5" height="42" rx="2.5" />
    <rect x="22" y="0" width="5" height="42" rx="2.5" />
    <!-- Base & Handle -->
    <path d="M 0 35 C 0 55 27 55 27 35 L 27 45 C 27 58 17 65 16 75 L 16 160 C 16 164 11 164 11 160 L 11 75 C 10 65 0 58 0 45 Z" />
  </g>

  <!-- Knife (Right) -->
  <g fill="#EA580C" transform="translate(285, 175)">
    <!-- Blade and Handle -->
    <path d="M 5 0 C 22 25 22 80 12 100 L 12 160 C 12 164 7 164 7 160 L 7 100 C 5 95 5 25 5 0 Z" />
  </g>

  <!-- Decorative Little Sparkle / Star at top right of plate -->
  <path d="M 345 140 Q 355 140 355 130 Q 355 140 365 140 Q 355 140 355 150 Q 355 140 345 140 Z" fill="#FDE047" />
  <circle cx="370" cy="165" r="4" fill="#FEF08A" />
</svg>
